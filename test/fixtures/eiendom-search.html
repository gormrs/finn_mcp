\u003e; type=module; asset-type=script\",\"github-action-job-38911071925-20-1\",\"\\n        \u003c!-- FINN HEADER (VERSION: eccf051df7cde4ae18bf3e484ab99c6163c4e06d) --\u003e\\n        \u003cstyle\u003ehtml { font-size: 62.5%; }\u003c/style\u003e\\n        \u003cscript\u003e\\n        const ensure = () =\u003e {\\n            const hasWarpTokens = Boolean(document.querySelector('head \u003e link[rel=\\\"stylesheet\\\"][href*=\\\"tokens\\\"]'));\\n            if (!hasWarpTokens) {\\n                const fonts = document.createElement(\\\"link\\\"); fonts.setAttribute(\\\"rel\\\", \\\"stylesheet\\\"); fonts.setAttribute(\\\"href\\\", \\\"https://assets.finn.no/pkg/@warp-ds/fonts/v1/finn-no.css\\\");\\n                const tokens = document.createElement(\\\"link\\\"); tokens.setAttribute(\\\"rel\\\", \\\"stylesheet\\\"); tokens.setAttribute(\\\"href\\\", \\\"https://assets.finn.no/pkg/@warp-ds/css/v2/tokens/finn-no.css\\\");\\n                document.head.prepend(fonts, tokens);\\n            }\\n        };\\n        ensure();\\n        const callback = (mutationList, observer) =\u003e {\\n            for (const mutation of mutationList) { if (mutation.type === \\\"childList\\\") { ensure(); } }\\n        };\\n        const obs = new MutationObserver(callback);\\n        obs.observe(document.head, { childList: true });\\n        \u003c/script\u003e\\n        \u003c!--lit-part mJ9+kFHYGVI=--\u003e\\n                \u003cspan\u003e\\n                    \u003c!--lit-node 1--\u003e\u003cfinn-topbar\\n                        \\n                        \\n                        \\n                        \\n                        \\n                        \\n                        \\n                        \\n                        \\n                        \\n                        \\n                     active-menu-item=\\\"NONE\\\" sites=\\\"//www.finn.no\\\" locale=\\\"nb\\\" translations=\\\"{\u0026quot;browser-warning.broadcast.aria-label\u0026quot;:[\u0026quot;Viktig melding\u0026quot;],\u0026quot;browser-warning.broadcast.content.expiration\u0026quot;:[\u0026quot;Fra 1. januar 2021 kan det hende at FINN ikke vil fungere for deg i det hele tatt, ettersom vi ikke lenger kommer til å støtte gamle versjoner av nettlesere.\u0026quot;],\u0026quot;browser-warning.broadcast.content.hello\u0026quot;:[\u0026quot;Hei! Vi ser at du bruker en eldre nettleser. Oppdater nettleseren din, så du er sikker på at FINN fungerer optimalt\u0026quot;],\u0026quot;browser-warning.broadcast.content.upgrade\u0026quot;:[\u0026quot;Vi anbefaler at du oppdaterer nettleseren eller enheten din til siste versjon. Eller hva med å teste en ny nettleser? Vi har noen forslag\u0026quot;],\u0026quot;browser-warning.broadcast.dismiss.aria-label\u0026quot;:[\u0026quot;Lukk\u0026quot;],\u0026quot;onboarding.dialog.button.back\u0026quot;:[\u0026quot;Tilbake\u0026quot;],\u0026quot;onboarding.dialog.button.discover-dba\u0026quot;:[\u0026quot;Utforsk den nye DBA\u0026quot;],\u0026quot;onboarding.dialog.button.finish\u0026quot;:[\u0026quot;Fullfør\u0026quot;],\u0026quot;onboarding.dialog.button.letsgo\u0026quot;:[\u0026quot;La oss sette i gang!\u0026quot;],\u0026quot;onboarding.dialog.button.next\u0026quot;:[\u0026quot;Neste\u0026quot;],\u0026quot;onboarding.dialog.button.remind-me-later\u0026quot;:[\u0026quot;Påminn meg senere\u0026quot;],\u0026quot;onboarding.dialog.button.take-tour\u0026quot;:[\u0026quot;Få en guidet tur\u0026quot;],\u0026quot;onboarding.dialog.content.first-screen.image.alttext.blocket\u0026quot;:[\u0026quot;Person som sklir ned en rød sklie, i retning av et FINN-skilt.\u0026quot;],\u0026quot;onboarding.dialog.content.first-screen.image.alttext.dba\u0026quot;:[\u0026quot;DBA-logo for lansering av ny plattform\u0026quot;],\u0026quot;onboarding.dialog.content.first-screen.image.alttext.tori\u0026quot;:[\u0026quot;En rød sirkel som inneholder ordene «ToriDiili – sikker betaling, problemfri levering».\u0026quot;],\u0026quot;onboarding.dialog.content.first-screen.text.blocket\u0026quot;:[\u0026quot;Dette er starten på nye FINN.no – med nye måter for å finne varer, lagre dem og selge. Torget er det samme som før, bare litt annerledes!\u0026quot;],\u0026quot;onboarding.dialog.content.first-screen.text.dba\u0026quot;:[\u0026quot;DBA har introdusert nye funksjoner som gjør det enklere å kjøpe og selge brukte ting. Ved å fortsette godtar jeg DBAs\u0026quot;],\u0026quot;onboarding.dialog.content.first-screen.text.tori\u0026quot;:[\u0026quot;Nå er den velkjente og sikre Tori enda tryggere og enklere å bruke. Du kan for eksempel handle gjennom Toris egen betalings- og frakttjeneste, ToriDiili.\u0026quot;],\u0026quot;onboarding.dialog.content.first-screen.title.blocket\u0026quot;:[\u0026quot;Vi har gjort noen endringer\u0026quot;],\u0026quot;onboarding.dialog.content.first-screen.title.dba\u0026quot;:[\u0026quot;Velkommen til en helt ny DBA-opplevelse\u0026quot;],\u0026quot;onboarding.dialog.content.first-screen.title.t-and-c-link-text.dba\u0026quot;:[\u0026quot;vilkår og betingelser.\u0026quot;],\u0026quot;onboarding.dialog.content.first-screen.title.tori\u0026quot;:[\u0026quot;Velkommen til det nye Tori!\u0026quot;],\u0026quot;onboarding.dialog.content.fourth-screen.image.alttext.blocket\u0026quot;:[\u0026quot;Hånd som holder et kamera som tar bilde av en polkadottmønstret vase på et bord.\u0026quot;],\u0026quot;onboarding.dialog.content.fourth-screen.image.alttext.dba\u0026quot;:[\u0026quot;Enkle, trygge salg med DBA. Eksempel på fraktalternativer basert på størrelsen på selgerens vare.\u0026quot;],\u0026quot;onboarding.dialog.content.fourth-screen.image.alttext.tori\u0026quot;:[\u0026quot;Selgerens profil i en annonse. Den viser navnet Liisa Andersson, identifisert person, Tori-bruker siden 2012. Selgeren har 16 vurderinger med en gjennomsnittlig vurdering på 8,7.\u0026quot;],\u0026quot;onboarding.dialog.content.fourth-screen.text.blocket\u0026quot;:[\u0026quot;Bedre utkast, bedre annonsestatistikk og spennende nye belønninger!\u0026quot;],\u0026quot;onboarding.dialog.content.fourth-screen.text.dba\u0026quot;:[\u0026quot;Du trenger ikke lenger utveksle personopplysninger eller ordne med betaling. Vi gjør alt for deg som selger, uten ekstra gebyrer.\u0026quot;],\u0026quot;onboarding.dialog.content.fourth-screen.text.tori\u0026quot;:[\u0026quot;Du kan se gjennom selgerens vurderinger og profil før du bestemmer deg for å kjøpe. Takket være kjøpsbeskyttelsen blir betalingen først overført til selgeren etter at du har hatt muligheten til å se over produktet etter levering.\u0026quot;],\u0026quot;onboarding.dialog.content.fourth-screen.title.blocket\u0026quot;:[\u0026quot;Selg brukt – bli belønnet\u0026quot;],\u0026quot;onboarding.dialog.content.fourth-screen.title.dba\u0026quot;:[\u0026quot;Enkle og trygge salg\u0026quot;],\u0026quot;onboarding.dialog.content.fourth-screen.title.tori\u0026quot;:[\u0026quot;Alle ToriDiili-kjøp inkluderer kjøpsbeskyttelse\u0026quot;],\u0026quot;onboarding.dialog.content.second-screen.image.alttext.blocket\u0026quot;:[\u0026quot;Hånd som holder en smarttelefon med bilde av en rød scooter.\u0026quot;],\u0026quot;onboarding.dialog.content.second-screen.image.alttext.dba\u0026quot;:[\u0026quot;Introduksjon til å sjekke vurderinger om handelspartnere. Profilkortet til Lisa Andersen, en bruker validert med MitID med en vurdering på 9,2 fra 16 vurderinger.\u0026quot;],\u0026quot;onboarding.dialog.content.second-screen.image.alttext.tori\u0026quot;:[\u0026quot;En smarttelefon som viser en Tori-annonse og en knapp med teksten «Legg inn et bud med ToriDiili».\u0026quot;],\u0026quot;onboarding.dialog.content.second-screen.text.blocket\u0026quot;:[\u0026quot;Flere søkemåter med flere kategorier og filtre. Enkel sending og sikre betalinger – som vanlig.\u0026quot;],\u0026quot;onboarding.dialog.content.second-screen.text.dba\u0026quot;:[\u0026quot;Se andres opplevelse med personen du handler med, før du kjøper eller selger.\u0026quot;],\u0026quot;onboarding.dialog.content.second-screen.text.tori\u0026quot;:[\u0026quot;Finn favoritter over hele Finland med bare noen få klikk! Du kan kjenne igjen annonser fra tjenesten ved hjelp av ToriDiili-logoen.\u0026quot;],\u0026quot;onboarding.dialog.content.second-screen.title.blocket\u0026quot;:[\u0026quot;Søk og handle smartere!\u0026quot;],\u0026quot;onboarding.dialog.content.second-screen.title.dba\u0026quot;:[\u0026quot;Se vurderinger fra andre\u0026quot;],\u0026quot;onboarding.dialog.content.second-screen.title.tori\u0026quot;:[\u0026quot;Handle som om du er i en nettbutikk\u0026quot;],\u0026quot;onboarding.dialog.content.third-screen.image.alttext.blocket\u0026quot;:[\u0026quot;Grønn sykkel med grå hjul og gult styre.\u0026quot;],\u0026quot;onboarding.dialog.content.third-screen.image.alttext.dba\u0026quot;:[\u0026quot;Kjøp sikkert med DBA i hele Danmark. Eksempelbetaling som viser en totalkostnad på 345 kr med et MobilePay-alternativ.\u0026quot;],\u0026quot;onboarding.dialog.content.third-screen.image.alttext.tori\u0026quot;:[\u0026quot;En smarttelefon som viser overskriften «Tilby ToriDiili – Toris nye frakt- og betalingstjeneste». En pil peker på pakkestørrelsen selgeren må velge ved sending.\u0026quot;],\u0026quot;onboarding.dialog.content.third-screen.text.blocket\u0026quot;:[\u0026quot;Sorter favoritter i lister og lagre så mange varslinger som du vil. I tillegg kan du se vurderinger av alle handler mellom enkeltpersoner, uansett hvordan du handler!\u0026quot;],\u0026quot;onboarding.dialog.content.third-screen.text.dba\u0026quot;:[\u0026quot;Nå kan du enkelt og trygt kjøpe varer fra hele Danmark med DBA gjennom Fiks ferdig.\u0026quot;],\u0026quot;onboarding.dialog.content.third-screen.text.tori\u0026quot;:[\u0026quot;Når du selger varen din med ToriDiili, trenger du ikke å utveksle kontaktinformasjon eller avtale betaling med kjøperen – dette håndteres automatisk gjennom Tori!\u0026quot;],\u0026quot;onboarding.dialog.content.third-screen.title.blocket\u0026quot;:[\u0026quot;Gå aldri glipp av et tilbud\u0026quot;],\u0026quot;onboarding.dialog.content.third-screen.title.dba\u0026quot;:[\u0026quot;Handle som om du er i en nettbutikk\u0026quot;],\u0026quot;onboarding.dialog.content.third-screen.title.tori\u0026quot;:[\u0026quot;Selg uten ekstra meldinger\u0026quot;],\u0026quot;onboarding.dialog.header.close-button.area-label\u0026quot;:[\u0026quot;Lukk\u0026quot;],\u0026quot;onboarding.dialog.header.close-icon.title\u0026quot;:[\u0026quot;Kryss\u0026quot;],\u0026quot;topbar.callout-wrapper-favorites.text\u0026quot;:[\u0026quot;Finn dine favoritter her\u0026quot;],\u0026quot;topbar.header.business-center.link\u0026quot;:[\u0026quot;For bedrifter\u0026quot;],\u0026quot;topbar.header.frontpage.link.aria-label\u0026quot;:[\u0026quot;Forside\u0026quot;],\u0026quot;topbar.header.logo.aria-label\u0026quot;:[\u0026quot;FINN.no logoen viser navnet FINN skrevet med hvit skrift i et lyseblått rektangel til høyre for en mørkeblå kvartsirkel.\u0026quot;],\u0026quot;topbar.header.messages.text\u0026quot;:[\u0026quot;Meldinger\u0026quot;],\u0026quot;topbar.header.new-ad.link\u0026quot;:[\u0026quot;Ny annonse\u0026quot;],\u0026quot;topbar.link.login\u0026quot;:[\u0026quot;Logg inn\u0026quot;],\u0026quot;topbar.link.profile\u0026quot;:[\u0026quot;Min \u0026quot;,[\u0026quot;brand\u0026quot;]],\u0026quot;topbar.notifications.link.aria-label\u0026quot;:[\u0026quot;Varslinger\u0026quot;],\u0026quot;topbar.notifications.link.text\u0026quot;:[\u0026quot;Varslinger\u0026quot;],\u0026quot;topbar.notifications.link.title\u0026quot;:[\u0026quot;Varslinger\u0026quot;],\u0026quot;topbar.profile-image.alt\u0026quot;:[\u0026quot;Mitt profilbilde\u0026quot;],\u0026quot;topbar.subtitle\u0026quot;:[\u0026quot;Mulighetenes marked\u0026quot;]}\\\" brand=\\\"FINN\\\" links=\\\"{\u0026quot;newAd\u0026quot;:\u0026quot;/create-item/start\u0026quot;}\\\" profile-image-url=\\\"https://images.finncdn.no/dynamic/80x80c/profile_placeholders/default\\\" messaging-unread-count
